[package]
name = "parse"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "parse"
path = "src/parse.rs"

[[bin]]
name = "pack"
path = "src/pack.rs"

[[bin]]
name = "tags"
path = "src/tags.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
scraper = "0.22"
sirocco = "0.3"
rayon = "1"
zstd = "0.14"
zeekstd = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

